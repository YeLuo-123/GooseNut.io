<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GooseNut · Memory Record</title>
    <script src="opening-animation.js"></script>
    <style>
 :root {
    --rotate-speed: 40;
    --count: 8;
    --easing: cubic-bezier(0.000,0.37,1.000,0.63);
}

body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #110921;
}
#vanta-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.void {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    position: relative;
    z-index: 1;
    aspect-ratio: 1/1;
}
ul:hover * {
    animation-play-state: paused;
}
ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    z-index: 1;

}

li {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 100%;
    animation: rotateCW calc(var(--rotate-speed)*1s)var(--easing) infinite;
}

.card {
    width: 36%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 16px 24px;
    gap: 8px;
    background: #a5cbff;
    box-shadow: 0px 4px 12px rgba(92, 19, 201, 0.1),0px 16px 32px rgba(165, 135, 255, 0.1);
    border-radius: 12px;
    font: 400 14px '';
    color: hsl(0, 0%, 30%);
    animation: rotateCCW calc(var(--rotate-speed)* 1s) var(--easing) infinite;
    cursor: pointer;
}
body.preview-open .card-list li,
body.preview-open .card-list .card {
    animation-play-state: paused;
}
body.timeline-paused .card-list li,
body.timeline-paused .card-list .card,
body.timeline-paused .needle {
    animation-play-state: paused;
}
.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
/* 链接样式 */
.card a {
    text-decoration: none;
    color: unset;
    display: block;
    width: 100%;
    height: 110px;
    overflow: hidden;
}
.preview-dialog {
    box-sizing: border-box;
    width: min(720px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    padding: 56px 24px 24px;
    border: 0;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 24px 80px rgba(12, 5, 46, 0.3);
    overflow: auto;
}
.preview-dialog[open] {
    animation: preview-zoom 0.25s ease-out;
}
.preview-dialog::backdrop {
    background: rgba(12, 5, 46, 0.65);
    backdrop-filter: blur(5px);
}
.preview-content {
    display: grid;
    place-items: center;
    gap: 20px;
}
.preview-description {
    width: 100%;
    margin: 0;
    color: #0d0935;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.preview-content img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: max(120px, calc(100vh - 230px));
    object-fit: contain;
}
.preview-year {
    padding: 40px;
    font-size: clamp(48px, 12vw, 96px);
    font-weight: 600;
    color: #333;
}
.preview-close {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: #f0edf7;
    color: #333;
    font-size: 24px;
    cursor: pointer;
}
@keyframes preview-zoom {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
}
.music-widget {
    --music-color: #b0d4ff;
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 10;
    max-width: calc(100vw - 32px);
    font-family: Arial, "Microsoft YaHei", sans-serif;
    color: #0d0935;
}
.music-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
}
.music-note-icon,
.music-track-name {
    background: var(--music-color);
    box-shadow: 0 4px 20px rgba(5, 8, 32, 0.2);
    transition: background 0.2s;
}
.music-note-icon {
    display: grid;
    place-items: center;
    flex: 0 0 54px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
}
.music-note-icon svg {
    position: static;
    display: block;
    width: 28px;
    height: 28px;
    z-index: auto;
}
.music-track-name {
    display: block;
    width: max-content;
    min-width: 0;
    padding: 13px 18px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.music-toggle:hover .music-note-icon,
.music-toggle:hover .music-track-name,
.music-toggle[aria-expanded="true"] .music-note-icon {
    background: #d7eaff;
}
.music-toggle:focus-visible {
    outline: 2px solid #b0d4ff;
    outline-offset: 6px;
    border-radius: 16px;
}
.music-panel {
    position: absolute;
    right: 0;
    bottom: calc(100% + 16px);
    width: min(360px, calc(100vw - 32px));
    border: 1px solid rgba(176, 212, 255, 0.5);
    border-radius: 16px;
    overflow: hidden;
    background: #eaf4ff;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
}
.music-panel[hidden] { display: none; }
.music-panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px 10px 16px;
    font-size: 14px;
    font-weight: 600;
}
.music-close {
    flex: 0 0 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: var(--music-color);
    color: inherit;
    font-size: 24px;
    cursor: pointer;
}
.music-embed iframe {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    min-height: 200px;
    border: 0;
    background: #0d0935;
}
.music-source {
    display: block;
    padding: 12px 16px;
    color: #264b83;
    font-size: 12px;
    text-decoration: none;
}
.music-source:hover { text-decoration: underline; }
@media (max-width: 600px) {
    .music-widget { right: 16px; bottom: 16px; }
    .music-note-icon { flex-basis: 46px; width: 46px; height: 46px; }
    .music-track-name { font-size: 13px; padding: 11px 14px; }
}

/* 框框高度 */
.model-name {
    font-weight: 500;
    font-size: 18px;
    line-height: 100%;
    color: #000000;
    display: block;
}
/* svg样式 */
svg {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
}
/* 列表的延迟 */
.card-list > li,
.card-list > li .card {
    animation-delay: calc(var(--rotate-speed) / var(--count) * var(--index) * -1s);
}

/* 顺时针动画 */
@keyframes rotateCW {
    from {
        transform: translate3d(0px, -50%, -1px) rotate(-45deg);
    }

    to {
        transform: translate3d(0px, -50%, 0px) rotate(-315deg);
    }
}
/* 逆时针动画 */
@keyframes rotateCCW {
    from {
        transform: rotate(45deg);
    }
    to {
        transform: rotate(315deg);
    }
}
/* 圆 */
.center-circle {
    position: absolute;
    width: 10%;
    min-width: 44px;
    padding: 0;
    border: 0;
    display: grid;
    place-items: center;
    color: #b0d4ff;
    cursor: pointer;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    aspect-ratio: 1 / 1;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    background: #0d0935;
    box-shadow: 0px 18px 36px -18px rgba(12, 5, 46, 0.3),
    0px 30px 60px -12px rgba(12, 5, 46, 0.25);
    border-radius: 50%;
    background-size: cover;
    background-position: -35px 0;
}
.center-circle:focus-visible {
    outline: 3px solid #b0d4ff;
    outline-offset: 5px;
}
.timeline-icon {
    width: 24%;
    height: 28%;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}
.timeline-icon::before,
.timeline-icon::after {
    content: "";
    width: 30%;
    height: 100%;
    border-radius: 2px;
    background: currentColor;
}
.center-circle[aria-pressed="true"] .timeline-icon {
    background: currentColor;
    clip-path: polygon(12% 0, 100% 50%, 12% 100%);
    transform: translateX(8%);
}
.center-circle[aria-pressed="true"] .timeline-icon::before,
.center-circle[aria-pressed="true"] .timeline-icon::after {
    display: none;
}
.timeline-tooltip {
    position: absolute;
    bottom: calc(100% + 14px);
    left: 50%;
    transform: translate(-50%, 4px);
    padding: 9px 14px;
    border-radius: 10px;
    background: #0d0935;
    color: #fff;
    font-size: 13px;
    line-height: 1.5;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
}
.center-circle:hover .timeline-tooltip,
.center-circle:focus-visible .timeline-tooltip {
    opacity: 1;
    transform: translate(-50%, 0);
}
.second-circle {
    position: absolute;
    width: 40%;
    aspect-ratio: 1 / 1;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #FFFFFF;
    box-shadow: 0px 18px 36px -18px rgba(0, 0, 0, 0.3),
    0px 30px 60px -12px rgba(0, 0, 0, 0.25);
    border-radius: 50%;
    background-size: cover;
    background-image: url(流体gif.gif);
}
.last-circle {
    position: absolute;
    width: 66%;
    aspect-ratio: 1 / 1;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    background: #FFFFFF;
    opacity: 0.25;
    box-shadow: 0px 18px 36px -18px rgba(0, 0, 0, 0.3),
    0px 30px 60px -12px rgba(0, 0, 0, 0.25);
    border-radius: 50%;
    background-image: url(流体gif.gif);
}
.crop {
    -webkit-mask-image: linear-gradient(90deg,rgba(0,0,0,0) 50%,rgba(0,0,0,1) 50%, rgb(104, 11, 11));
}
.mask {
    position: fixed;
    inset: 0 auto 0 0;
    width: 50vw;
    z-index: 2;
    background: #fff;
    overflow: hidden;
}
.mask.has-burn-edge {
    --seam-width: clamp(72px, 12vw, 144px);
    --seam-overhang: calc(var(--seam-width) / 3);
    --seam-offset: 40px;
    width: calc(50vw + var(--seam-overhang) + var(--seam-offset));
    background-image: var(--burn-color);
    background-size: var(--seam-width) 1024px;
    background-position: right top;
    background-repeat: repeat-y;
    -webkit-mask-image: linear-gradient(#fff, #fff), var(--burn-alpha);
    mask-image: linear-gradient(#fff, #fff), var(--burn-alpha);
    -webkit-mask-size: calc(100% - var(--seam-width) + 1px) 100%, var(--seam-width) 1024px;
    mask-size: calc(100% - var(--seam-width) + 1px) 100%, var(--seam-width) 1024px;
    -webkit-mask-position: left top, right top;
    mask-position: left top, right top;
    -webkit-mask-repeat: no-repeat, repeat-y;
    mask-repeat: no-repeat, repeat-y;
    animation: burn-drift 45s linear infinite;
}
/* 淡纸纹：调大 opacity 会加深纹理；独立叠层沿用遮罩的溶解轮廓。 */
.mask::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("paper-texture.svg") repeat;
    background-size: 180px 180px;
    opacity: 0.065;
    pointer-events: none;
}
.pointer-lens {
    position: absolute;
    inset: 0 auto 0 0;
    width: 50vw;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    /* 照片在纸面边缘淡出，保留原来的深蓝色焦痕。 */
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 72px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 72px), transparent);
}
.mask > :not(.pointer-lens) { z-index: 1; }
.mask.has-burn-edge .side-title {
    right: var(--seam-overhang);
}
@keyframes burn-drift {
    to {
        background-position: 100% -1024px;
        -webkit-mask-position: 0 0, 100% -1024px;
        mask-position: 0 0, 100% -1024px;
    }
}
@media (prefers-reduced-motion: reduce) {
    .mask.has-burn-edge { animation: none; }
}
.side-title {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translate(25%, -50%);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, min(8vw, 10vh), 120px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.04em;
    white-space: nowrap;
    color: rgba(129, 166, 221, 0.36);
    text-shadow: 0 0 32px rgba(44, 91, 167, 0.18);
    user-select: none;
    pointer-events: none;
}

/* 角落英文装饰：只作排版点缀，不拦截鼠标。 */
.corner-caption {
    position: absolute;
    margin: 0;
    font-family: Arial, sans-serif;
    font-size: clamp(9px, 0.75vw, 11px);
    font-weight: 400;
    line-height: 1.8;
    letter-spacing: 0.2em;
    color: #829bbd;
    pointer-events: none;
    user-select: none;
}
.corner-caption span { display: block; }
.corner-caption--top-left {
    top: 26px;
    left: clamp(16px, 4vw, 64px);
    max-width: calc(50vw - 40px);
}
.corner-caption--top-left::before {
    content: "";
    display: block;
    width: 32px;
    height: 1px;
    margin-bottom: 10px;
    background: #b0d4ff;
}
.corner-caption--top-left .corner-subline {
    margin-top: 3px;
    font-size: 9px;
    letter-spacing: 0.1em;
}
.corner-caption--bottom-left {
    bottom: 3px;
    left: clamp(16px, 4vw, 64px);
    max-width: calc(50vw - 32px);
    font-size: 8px;
    letter-spacing: 0.12em;
}
.corner-caption--top-right {
    position: fixed;
    z-index: 6;
    top: 28px;
    right: 28px;
    max-width: calc(50vw - 32px);
    color: rgba(176, 212, 255, 0.65);
    text-align: right;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(12px, 1.2vw, 18px);
    font-style: italic;
    letter-spacing: 0.06em;
}
@media (max-width: 600px) {
    .corner-caption--top-left { top: 20px; letter-spacing: 0.12em; }
    .corner-caption--top-right { top: 20px; right: 16px; }
}
@media (max-height: 480px) {
    .corner-caption--top-left { display: none; }
}
.memory-note {
    position: absolute;
    top: clamp(24px, 20vh, 180px);
    left: clamp(16px, 4vw, 64px);
    width: min(340px, calc(50vw - clamp(48px, 9vw, 144px)));
    max-height: max(80px, calc(100vh - clamp(24px, 20vh, 180px) - clamp(105px, 14vw, 180px) * 1.55 - 44px));
    overflow-y: auto;
    scrollbar-width: thin;
    color: #0d0935;
    font-family: "KaiTi", "STKaiti", "Songti SC", "SimSun", serif;
    font-size: clamp(13px, 1.15vw, 17px);
    line-height: 2.2;
    letter-spacing: 0.04em;
    overflow-wrap: anywhere;
}
.memory-note p {
    margin: 0 0 1em;
}
.memory-note .memory-signature {
    margin: 1.4em 0 0;
    text-align: right;
}
@media (max-width: 600px) {
    .memory-note { line-height: 1.9; }
}
.goose-lane {
    --goose-height: clamp(105px, 14vw, 180px);
    position: absolute;
    left: 0;
    bottom: 20px;
    width: 50vw;
    height: calc(var(--goose-height) * 1.55);
    overflow: hidden;
    pointer-events: none;
}
.goose {
    position: absolute;
    z-index: 1;
    left: 100%;
    bottom: 0;
    height: var(--goose-height);
    aspect-ratio: 282 / 361;
    overflow: visible;
    pointer-events: auto;
    animation: goose-travel 18s linear infinite;
    animation-delay: -4.5s;
}
.goose-frame {
    /* 三帧共用相同原图坐标，气泡可超出鹅的悬停区域。 */
    position: absolute;
    left: -298.58156%;
    top: -155.95568%;
    width: 846.80851%;
    max-width: none;
    height: auto;
    display: block;
    user-select: none;
    pointer-events: none;
    animation: goose-steps 0.56s step-end infinite;
}
.goose-frame--second {
    animation-delay: -0.28s;
}
.goose-frame--hover {
    animation: none;
    opacity: 1;
    visibility: hidden;
}
.goose:hover {
    animation-play-state: paused;
}
.goose:hover .goose-frame:not(.goose-frame--hover) {
    animation-play-state: paused;
    visibility: hidden;
}
.goose:hover .goose-frame--hover {
    visibility: visible;
}
.goose-trail {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}
.goose-footprint {
    position: absolute;
    width: clamp(6px, 0.65vw, 10px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle,
        rgba(13, 9, 53, 0.4) 0%,
        rgba(13, 9, 53, 0.2) 35%,
        rgba(13, 9, 53, 0) 75%);
    animation: footprint-fade 3.6s linear forwards;
}
@keyframes footprint-fade {
    from { opacity: 0.85; transform: translate(-50%, -50%) scale(0.85); }
    to { opacity: 0; transform: translate(-50%, -50%) scale(1.25); }
}
@keyframes goose-travel {
    from { transform: translateX(0); }
    to { transform: translateX(calc(-50vw - 100%)); }
}
@keyframes goose-steps {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
    .goose { left: 24px; animation: none; }
    .goose-frame { animation: none; }
    .goose-frame--second { opacity: 0; }
    .goose-trail { display: none; }
}

.needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44%;
    aspect-ratio: 1;
    z-index: 4;
    pointer-events: none;
    transform-origin: 44.8% 91.5%;
    animation: clock 120s linear infinite;
}
.needle img {
    display: block;
    width: 100%;
    height: 100%;
}
@keyframes clock {
    from {
        transform: translate(-44.8%, -91.5%) rotate(0deg);
    }
    to {
        transform: translate(-44.8%, -91.5%) rotate(360deg);
    }
}
/* 首次入场前隐藏对应元素，防止先显示完整页面再播放动画。 */
html.intro-pending .mask,
html.intro-pending .side-title,
html.intro-pending .memory-note,
html.intro-pending .crop,
html.intro-pending .center-circle,
html.intro-pending .needle,
html.intro-pending .goose-lane {
    opacity: 0;
}
@media (prefers-reduced-motion: reduce) {
    html.intro-pending .mask,
    html.intro-pending .side-title,
    html.intro-pending .memory-note,
    html.intro-pending .crop,
    html.intro-pending .center-circle,
    html.intro-pending .needle,
    html.intro-pending .goose-lane { opacity: 1; }
}
    </style>
</head>
<body>
    <div id="vanta-bg" aria-hidden="true"></div>
    <!-- 右上角英文装饰文案 -->
    <p class="corner-caption corner-caption--top-right" aria-hidden="true" lang="en">
        <span>Some moments</span>
        <span>stay with us.</span>
    </p>
    <div class="void" id="void">
        <div class="crop">
            <!-- 照片说明：修改每张卡片 data-description 引号内的文字，点击照片后会显示在图片下方。 -->
            <ul class="card-list" style="--count:9;">
                <li style="--index:0;">
                    <div class="card" data-description="2025.5 妻子假装游客在我的摊位前占位，站街，挪一次五十，我准备拍照留证，但是拍她的时候她感到不好意思不让我拍。"><a href="photos/028da2905db2d06d40d2f81ac4f59ad2.jpg">
                        <img src="photos/028da2905db2d06d40d2f81ac4f59ad2.jpg" alt="回忆照片 1"></a></div>
                </li>
                <li style="--index:1;">
                    <div class="card" data-description="2025.4.14 ga08因为大风变成摊主only，撤展的时候让妻子去帮忙拿1个袋子，结果妻子拿回来了20个，还戴在头上说这个是盖头。"><a href="photos/3388ae8ae5231a1cfb426622cb3d7765.jpg">
                        <img src="photos/3388ae8ae5231a1cfb426622cb3d7765.jpg" alt="回忆照片 2"></a></div>
                </li>
                <li style="--index:2;">
                    <div class="card" data-description="2025.4 和妻子打了双影奇境全成就，被炸弹炸死了很多次。"><a href="photos/371d11ab36832537ad14d32935efdae8.jpg">
                        <img src="photos/371d11ab36832537ad14d32935efdae8.jpg" alt="回忆照片 3"></a></div>

    <script>
        if (window.VANTA && window.VANTA.BIRDS) {
            VANTA.BIRDS({
                el: '#vanta-bg',
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200,
                minWidth: 200,
                scale: 1,
                scaleMobile: 1,
                backgroundAlpha: 1,
                backgroundColor: 0x110921,
                color1: 0x0f60e0,
                color2: 0x76ffca,
                colorMode: 'varianceGradient',
                birdSize: 2.6,
                wingSpan: 23,
                speedLimit: 5,
                separation: 73,
                alignment: 10,
                cohesion: 20,
                quantity: 4
            });
        }

        const timelineToggle = document.getElementById('timeline-toggle');
        const timelineTooltip = timelineToggle.querySelector('.timeline-tooltip');
        timelineToggle.addEventListener('click', () => {
            const paused = document.body.classList.toggle('timeline-paused');
            timelineToggle.setAttribute('aria-pressed', String(paused));
            timelineToggle.setAttribute('aria-label', paused ? '继续播放卡片和指针' : '暂停卡片和指针');
            timelineTooltip.textContent = paused ? '让时间继续走' : '让时间停一下';
        });

        const previewDialog = document.getElementById('preview-dialog');
        const previewContent = document.getElementById('preview-content');

        document.querySelectorAll('.card-list .card').forEach(card => {
            card.addEventListener('click', event => {
                event.preventDefault();
                const image = card.querySelector('img');
                previewContent.replaceChildren();

                if (image) {
                    previewContent.append(image.cloneNode());
                    const description = document.createElement('p');
                    description.className = 'preview-description';
                    description.textContent = card.dataset.description || '';
                    previewContent.append(description);
                } else {
                    const year = document.createElement('div');
                    year.className = 'preview-year';
                    year.textContent = card.textContent.trim();
                    previewContent.append(year);
                }

                document.body.classList.add('preview-open');
                previewDialog.showModal();
            });
        });

        previewDialog.querySelector('.preview-close').addEventListener('click', () => previewDialog.close());
        previewDialog.addEventListener('click', event => {
            if (event.target === previewDialog) previewDialog.close();
        });
        previewDialog.addEventListener('close', () => document.body.classList.remove('preview-open'));
    </script>
